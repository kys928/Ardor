name: v14a2 Canonical Evaluation RunPod

on:
  push:
    branches: [main]
    paths:
      - 'runpod/jobs/ardor-canonical-v14a2-eval-dispatch-20260904.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: ardor-v14a2-canonical-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
      RUNPOD_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ardor-runpod:latest
      RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ${{ vars.RUNPOD_CONTAINER_REGISTRY_AUTH_ID }}

    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install control-plane dependency
        run: python -m pip install --disable-pip-version-check boto3
      - name: Launch fixed canonical evaluation
        run: python Erratum/launch_v14a2_canonical_eval.py
      - name: Start continuous RunPod supervisor
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run runpod-supervisor.yml --ref main
