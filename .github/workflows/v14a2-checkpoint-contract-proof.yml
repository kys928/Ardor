name: v14a2 Checkpoint Contract Proof

on:
  push:
    paths:
      - 'scripts/v14a2_checkpoint_contract_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install proof dependencies
        run: |
          python -m pip install --disable-pip-version-check boto3 torch tokenizers numpy tqdm nltk

      - name: Prove repaired v14a2 strict checkpoint contract
        run: |
          python scripts/v14a2_checkpoint_contract_probe.py --output checkpoint_contract_proof.json

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14a2-checkpoint-contract-proof-${{ github.run_id }}
          path: checkpoint_contract_proof.json
          if-no-files-found: error
          retention-days: 30
