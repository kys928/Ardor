name: v14 Route Data Scientific Audit

on:
  push:
    paths:
      - 'Erratum/triggers/v14-route-data-audit-20260904.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check boto3
      - name: Audit exact route datasets
        env:
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
          RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
          RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
        run: python Erratum/audit_v14_route_data.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: v14-route-data-audit
          path: route_data_audit.json
          if-no-files-found: error
          retention-days: 30
