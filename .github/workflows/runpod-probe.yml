name: Ardor RunPod Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "runpod/inspect/v14a5-r2-probe-20260919.json"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}

    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5

      - name: Inspect v14a5 Pod with runpodctl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64 -o /tmp/runpodctl
          chmod +x /tmp/runpodctl
          mkdir -p "$HOME/.runpod"
          printf '{}\n' > "$HOME/.runpod/.runpod.yaml"
          /tmp/runpodctl config --apiKey "$RUNPOD_API_KEY" >/dev/null

          python - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          path = Path('runpod/inspect/v14a5-r2-probe-20260919.json')
          spec = json.loads(path.read_text())
          pod_id = str(spec.get('pod_id', '')).strip()
          if not re.fullmatch(r'[A-Za-z0-9_-]{4,64}', pod_id):
              raise SystemExit('Unsafe or missing pod id')
          print(f'=== POD {pod_id} ===')
          subprocess.run(['/tmp/runpodctl', 'pod', 'get', pod_id], check=True)
          PY
