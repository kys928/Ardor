name: Ardor RunPod Pod Inspect

on:
  push:
    branches: [main]
    paths:
      - "runpod/inspect/*.json"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Inspect requested Pods, registry images, and GPU capacity
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA" -- 'runpod/inspect/*.json' > /tmp/runpod-inspect.txt
          python - <<'PY'
          import json, os, re, subprocess, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          def check_public_ghcr(tag: str) -> None:
              if not re.fullmatch(r'sha-[0-9a-f]{40}', tag):
                  raise SystemExit(f'Unsafe image tag: {tag!r}')
              scope = 'repository:kys928/ardor-runpod:pull'
              token_url = 'https://ghcr.io/token?' + urllib.parse.urlencode({'scope': scope})
              with urllib.request.urlopen(token_url, timeout=45) as response:
                  token = json.load(response).get('token', '')
              if not token:
                  raise SystemExit('GHCR did not return an anonymous pull token')
              req = urllib.request.Request(
                  f'https://ghcr.io/v2/kys928/ardor-runpod/manifests/{tag}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      manifest = json.load(response)
                      print(json.dumps({
                          'ghcr_public_pull': True,
                          'image': f'ghcr.io/kys928/ardor-runpod:{tag}',
                          'mediaType': manifest.get('mediaType'),
                          'schemaVersion': manifest.get('schemaVersion'),
                      }, indent=2))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  print(json.dumps({
                      'ghcr_public_pull': False,
                      'image': f'ghcr.io/kys928/ardor-runpod:{tag}',
                      'http_status': exc.code,
                      'body': body,
                  }, indent=2))
                  raise SystemExit('GHCR image is not anonymously pullable')

          def inspect_datacenter(datacenter: str) -> None:
              if not re.fullmatch(r'[A-Z]{2,3}-[A-Z]{2,3}-[0-9]+', datacenter):
                  raise SystemExit(f'Unsafe datacenter id: {datacenter!r}')
              binary = Path('/tmp/runpodctl')
              if not binary.exists():
                  urllib.request.urlretrieve(
                      'https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64',
                      binary,
                  )
                  binary.chmod(0o755)
              config_dir = Path.home() / '.runpod'
              config_dir.mkdir(parents=True, exist_ok=True)
              config_file = config_dir / '.runpod.yaml'
              if not config_file.exists():
                  config_file.write_text('{}\n', encoding='utf-8')
              subprocess.run(
                  [str(binary), 'config', '--apiKey', os.environ['RUNPOD_API_KEY']],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              raw = subprocess.check_output([str(binary), 'datacenter', 'list'], text=True)
              rows = json.loads(raw)
              match = next((row for row in rows if row.get('id') == datacenter), None)
              if match is None:
                  raise SystemExit(f'Datacenter not returned by RunPod: {datacenter}')
              print(json.dumps({'datacenter': match}, indent=2))

          def inspect_precise_availability(datacenter: str, gpu_type_ids: list[str]) -> None:
              if not re.fullmatch(r'[A-Z]{2,3}-[A-Z]{2,3}-[0-9]+', datacenter):
                  raise SystemExit(f'Unsafe datacenter id: {datacenter!r}')
              if not gpu_type_ids or len(gpu_type_ids) > 32:
                  raise SystemExit('gpu_type_ids must contain between 1 and 32 items')
              for gpu_id in gpu_type_ids:
                  if not re.fullmatch(r'[A-Za-z0-9 ._-]{2,128}', gpu_id):
                      raise SystemExit(f'Unsafe gpu type id: {gpu_id!r}')

              query = '''
              query Availability($gpuTypes: GpuTypeFilter!, $priceInput: GpuLowestPriceInput) {
                gpuTypes(input: $gpuTypes) {
                  id
                  displayName
                  secureCloud
                  maxGpuCountSecureCloud
                  lowestPrice(input: $priceInput) {
                    gpuName
                    gpuTypeId
                    uninterruptablePrice
                    stockStatus
                    rentedCount
                    totalCount
                    maxGpuCount
                    maxUnreservedGpuCount
                    availableGpuCounts
                    countryCode
                  }
                }
              }
              '''
              payload = json.dumps({
                  'query': query,
                  'variables': {
                      'gpuTypes': {'ids': gpu_type_ids},
                      'priceInput': {
                          'dataCenterId': datacenter,
                          'gpuCount': 1,
                          'secureCloud': True,
                      },
                  },
              }).encode('utf-8')
              req = urllib.request.Request(
                  'https://api.runpod.io/graphql',
                  data=payload,
                  headers={
                      'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY']}",
                      'Content-Type': 'application/json',
                      'Accept': 'application/json',
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  result = json.load(response)
              if result.get('errors'):
                  raise SystemExit('RunPod GraphQL availability query failed: ' + json.dumps(result['errors']))
              rows = result.get('data', {}).get('gpuTypes') or []
              print(json.dumps({
                  'precise_gpu_availability': {
                      'datacenter': datacenter,
                      'secureCloud': True,
                      'gpuCount': 1,
                      'gpuTypes': rows,
                  }
              }, indent=2))

          for raw_path in Path('/tmp/runpod-inspect.txt').read_text().splitlines():
              path = Path(raw_path.strip())
              if not path.is_file():
                  continue
              spec = json.loads(path.read_text())

              image_tag = str(spec.get('image_tag', '')).strip()
              if image_tag:
                  check_public_ghcr(image_tag)

              datacenter = str(spec.get('datacenter', '')).strip()
              if datacenter:
                  inspect_datacenter(datacenter)

              precise = spec.get('precise_availability')
              if precise is not None:
                  if not isinstance(precise, dict):
                      raise SystemExit('precise_availability must be an object')
                  precise_dc = str(precise.get('datacenter', '')).strip()
                  precise_gpu_ids = precise.get('gpu_type_ids')
                  if not isinstance(precise_gpu_ids, list):
                      raise SystemExit('precise_availability.gpu_type_ids must be a list')
                  inspect_precise_availability(precise_dc, [str(x) for x in precise_gpu_ids])

              pod_id = str(spec.get('pod_id', '')).strip()
              if not pod_id:
                  continue
              if not re.fullmatch(r'[A-Za-z0-9_-]{4,64}', pod_id):
                  raise SystemExit(f'Unsafe pod id in {path}')
              req = urllib.request.Request(
                  f'https://rest.runpod.io/v1/pods/{pod_id}',
                  headers={
                      'Authorization': f"Bearer {os.environ['RUNPOD_API_KEY']}",
                      'Accept': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      pod = json.load(response)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  print(json.dumps({'pod_id': pod_id, 'http_status': exc.code, 'body': body}))
                  continue

              allowed = [
                  'id', 'name', 'desiredStatus', 'status', 'cloudType', 'gpuCount',
                  'gpuTypeIds', 'costPerHr', 'adjustedCostPerHr', 'imageName',
                  'networkVolumeId', 'volumeMountPath', 'lastStatusChange', 'runtime',
                  'machine', 'interruptible'
              ]
              safe = {key: pod.get(key) for key in allowed if key in pod}
              print(json.dumps({'pod': safe}, indent=2, default=str))
          PY
