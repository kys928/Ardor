name: Patch Canonical Resume Config

on:
  push:
    branches: [fix/canonical-checkpoint-migration]
    paths:
      - '.github/workflows/patch-canonical-resume-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/canonical-checkpoint-migration
      - name: Apply deterministic canonical resume patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Cerebrum/Cortex/neural_plasticity_training.py')
          text = path.read_text(encoding='utf-8')

          main_marker = '# -------------------------\n# Main\n# -------------------------\ndef main() -> None:\n'
          helper = (
              'def resolve_model_config(\n'
              '    ArdorConfig: Any,\n'
              '    *,\n'
              '    args: argparse.Namespace,\n'
              '    cfg_stage: StageConfig,\n'
              '    vocab_size: int,\n'
              '    special_ids: Dict[str, Optional[int]],\n'
              '    resume_meta: Dict[str, Any],\n'
              ') -> Any:\n'
              '    declared = resume_meta.get("model_config")\n'
              '    if declared is None:\n'
              '        cfg = ArdorConfig(\n'
              '            vocab_size=vocab_size,\n'
              '            hidden_size=args.hidden_size,\n'
              '            n_layers=args.n_layers,\n'
              '            n_heads=args.n_heads,\n'
              '            ff_mult=args.ff_mult,\n'
              '            max_len=args.ctx,\n'
              '            dropout=cfg_stage.dropout,\n'
              '            attn_dropout=cfg_stage.dropout,\n'
              '            resid_dropout=cfg_stage.dropout,\n'
              '            use_rope=True,\n'
              '            rope_theta=10000.0,\n'
              '        )\n'
              '        cfg.validate()\n'
              '        return cfg\n'
              '\n'
              '    if not isinstance(declared, dict):\n'
              '        raise SystemExit("Resume checkpoint meta.model_config must be an object.")\n'
              '    cfg = ArdorConfig.from_dict(declared)\n'
              '\n'
              '    cli_contract = {\n'
              '        "hidden_size": int(args.hidden_size),\n'
              '        "n_layers": int(args.n_layers),\n'
              '        "n_heads": int(args.n_heads),\n'
              '        "ff_mult": int(args.ff_mult),\n'
              '        "max_len": int(args.ctx),\n'
              '    }\n'
              '    checkpoint_contract = {\n'
              '        "hidden_size": int(cfg.hidden_size),\n'
              '        "n_layers": int(cfg.n_layers),\n'
              '        "n_heads": int(cfg.n_heads),\n'
              '        "ff_mult": int(cfg.ff_mult),\n'
              '        "max_len": int(cfg.max_len),\n'
              '    }\n'
              '    conflicts = {\n'
              '        name: {"cli": cli_contract[name], "checkpoint": checkpoint_contract[name]}\n'
              '        for name in cli_contract\n'
              '        if cli_contract[name] != checkpoint_contract[name]\n'
              '    }\n'
              '    if conflicts:\n'
              '        raise SystemExit(\n'
              '            "Resume checkpoint model_config conflicts with canonical architecture CLI: "\n'
              '            + json.dumps(conflicts, sort_keys=True)\n'
              '        )\n'
              '    if int(cfg.vocab_size) != int(vocab_size):\n'
              '        raise SystemExit(\n'
              '            f"Resume checkpoint vocab_size={cfg.vocab_size} does not match tokenizer vocab_size={vocab_size}."\n'
              '        )\n'
              '\n'
              '    checkpoint_special_ids = resume_meta.get("special_ids")\n'
              '    if checkpoint_special_ids is not None:\n'
              '        if not isinstance(checkpoint_special_ids, dict):\n'
              '            raise SystemExit("Resume checkpoint meta.special_ids must be an object when present.")\n'
              '        normalized = {key: checkpoint_special_ids.get(key) for key in special_ids}\n'
              '        if normalized != special_ids:\n'
              '            raise SystemExit(\n'
              '                "Resume checkpoint special-token ids do not match the selected tokenizer: "\n'
              '                + json.dumps({"checkpoint": normalized, "tokenizer": special_ids}, sort_keys=True)\n'
              '            )\n'
              '    return cfg\n'
              '\n'
              '\n'
          )
          if text.count(main_marker) != 1:
              raise SystemExit(f'Expected one Main marker, found {text.count(main_marker)}')
          if 'def resolve_model_config(' in text:
              raise SystemExit('resolve_model_config already exists; refusing duplicate patch')
          text = text.replace(main_marker, helper + main_marker, 1)

          config_start_marker = '    sp = tokenizer_special_ids(args.tokenizer)\n'
          config_end_marker = '\n\n    dec_cls = import_project_decoder()'
          config_start = text.find(config_start_marker)
          config_end = text.find(config_end_marker, config_start)
          if config_start < 0 or config_end < 0:
              raise SystemExit('Could not bound canonical model construction block')
          old_config = text[config_start:config_end]
          required_config_fragments = [
              'model_cfg = ArdorConfig(',
              'dropout=cfg_stage.dropout,',
              'attn_dropout=cfg_stage.dropout,',
              'resid_dropout=cfg_stage.dropout,',
              'use_rope=True,',
              'rope_theta=10000.0,',
              'model_cfg.validate()',
          ]
          if not all(fragment in old_config for fragment in required_config_fragments):
              raise SystemExit('Bounded model construction block does not match verified canonical structure')
          new_config = (
              '    sp = tokenizer_special_ids(args.tokenizer)\n'
              '    vocab_size = tokenizer_vocab_size(args.tokenizer)\n'
              '    cfg_stage = STAGE_PRESETS[args.stage]\n'
              '\n'
              '    resume_ckpt: Optional[Dict[str, Any]] = None\n'
              '    resume_meta: Dict[str, Any] = {}\n'
              '    if args.resume is not None:\n'
              '        if not args.resume.exists():\n'
              '            raise SystemExit(f"Missing resume checkpoint: {args.resume}")\n'
              '        loaded = torch.load(args.resume, map_location="cpu")\n'
              '        if not isinstance(loaded, dict):\n'
              '            raise SystemExit("Resume checkpoint must be a dictionary.")\n'
              '        resume_ckpt = loaded\n'
              '        raw_meta = loaded.get("meta", {})\n'
              '        if raw_meta is None:\n'
              '            raw_meta = {}\n'
              '        if not isinstance(raw_meta, dict):\n'
              '            raise SystemExit("Resume checkpoint meta must be an object.")\n'
              '        resume_meta = raw_meta\n'
              '\n'
              '    ArdorConfig = import_project_config()\n'
              '    model_cfg = resolve_model_config(\n'
              '        ArdorConfig,\n'
              '        args=args,\n'
              '        cfg_stage=cfg_stage,\n'
              '        vocab_size=vocab_size,\n'
              '        special_ids=sp,\n'
              '        resume_meta=resume_meta,\n'
              '    )\n'
              '    if resume_ckpt is not None and "model_config" not in resume_meta:\n'
              '        print(f"[{now_str()}] [resume] checkpoint has no meta.model_config; using canonical CLI/stage model config")\n'
          )
          text = text[:config_start] + new_config + text[config_end:]

          resume_start_marker = '    if args.resume is not None and args.resume.exists():\n'
          resume_end_marker = '\n\n    train_batcher = None'
          resume_start = text.find(resume_start_marker)
          resume_end = text.find(resume_end_marker, resume_start)
          if resume_start < 0 or resume_end < 0:
              raise SystemExit('Could not bound canonical resume restore block')
          old_resume = text[resume_start:resume_end]
          required_resume_fragments = [
              'torch.load(args.resume, map_location="cpu")',
              'model.load_state_dict(ckpt["model"], strict=True)',
              'optimizer.load_state_dict(ckpt["optimizer"])',
          ]
          if not all(fragment in old_resume for fragment in required_resume_fragments):
              raise SystemExit('Bounded resume block does not match verified canonical restore structure')
          new_resume = (
              '    if resume_ckpt is not None:\n'
              '        model.load_state_dict(resume_ckpt["model"], strict=True)\n'
              '        if "optimizer" in resume_ckpt:\n'
              '            optimizer.load_state_dict(resume_ckpt["optimizer"])\n'
              '        global_step = int(resume_meta.get("step", 0))\n'
              '        tokens_seen = int(resume_meta.get("tokens_seen", 0))\n'
              '        best_val = float(resume_meta.get("best_val", best_val))\n'
              '        print(f"[{now_str()}] [resume] ckpt={args.resume} step={global_step} tokens_seen={tokens_seen:,}")\n'
          )
          text = text[:resume_start] + new_resume + text[resume_end:]

          save_pattern = '                    "best_val": best_val,\n                    "special_ids": sp,\n'
          save_replacement = save_pattern + '                    "model_config": asdict(model_cfg),\n'
          if text.count(save_pattern) != 2:
              raise SystemExit(f'Expected two periodic checkpoint metadata blocks, found {text.count(save_pattern)}')
          text = text.replace(save_pattern, save_replacement)

          final_pattern = '            "best_val": best_val,\n            "special_ids": sp,\n'
          final_replacement = final_pattern + '            "model_config": asdict(model_cfg),\n'
          if text.count(final_pattern) != 1:
              raise SystemExit(f'Expected one final checkpoint metadata block, found {text.count(final_pattern)}')
          text = text.replace(final_pattern, final_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile Cerebrum/Cortex/neural_plasticity_training.py
          git diff --check
      - name: Commit trainer fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cerebrum/Cortex/neural_plasticity_training.py
          git commit -m 'Honor checkpoint model config on canonical resume'
          git push origin HEAD:fix/canonical-checkpoint-migration
