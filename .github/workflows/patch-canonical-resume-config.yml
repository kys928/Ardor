name: Patch Canonical Resume Config

on:
  push:
    branches: [fix/canonical-checkpoint-migration]
    paths:
      - '.github/workflows/patch-canonical-resume-config.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/canonical-checkpoint-migration
      - name: Apply deterministic canonical resume patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('Cerebrum/Cortex/neural_plasticity_training.py')
          text = path.read_text(encoding='utf-8')

          main_marker = '''# -------------------------
          # Main
          # -------------------------
          def main() -> None:
          '''.replace('          ', '')
          helper = '''def resolve_model_config(
              ArdorConfig: Any,
              *,
              args: argparse.Namespace,
              cfg_stage: StageConfig,
              vocab_size: int,
              special_ids: Dict[str, Optional[int]],
              resume_meta: Dict[str, Any],
          ) -> Any:
              declared = resume_meta.get("model_config")
              if declared is None:
                  cfg = ArdorConfig(
                      vocab_size=vocab_size,
                      hidden_size=args.hidden_size,
                      n_layers=args.n_layers,
                      n_heads=args.n_heads,
                      ff_mult=args.ff_mult,
                      max_len=args.ctx,
                      dropout=cfg_stage.dropout,
                      attn_dropout=cfg_stage.dropout,
                      resid_dropout=cfg_stage.dropout,
                      use_rope=True,
                      rope_theta=10000.0,
                  )
                  cfg.validate()
                  return cfg

              if not isinstance(declared, dict):
                  raise SystemExit("Resume checkpoint meta.model_config must be an object.")
              cfg = ArdorConfig.from_dict(declared)

              cli_contract = {
                  "hidden_size": int(args.hidden_size),
                  "n_layers": int(args.n_layers),
                  "n_heads": int(args.n_heads),
                  "ff_mult": int(args.ff_mult),
                  "max_len": int(args.ctx),
              }
              checkpoint_contract = {
                  "hidden_size": int(cfg.hidden_size),
                  "n_layers": int(cfg.n_layers),
                  "n_heads": int(cfg.n_heads),
                  "ff_mult": int(cfg.ff_mult),
                  "max_len": int(cfg.max_len),
              }
              conflicts = {
                  name: {"cli": cli_contract[name], "checkpoint": checkpoint_contract[name]}
                  for name in cli_contract
                  if cli_contract[name] != checkpoint_contract[name]
              }
              if conflicts:
                  raise SystemExit(
                      "Resume checkpoint model_config conflicts with canonical architecture CLI: "
                      + json.dumps(conflicts, sort_keys=True)
                  )
              if int(cfg.vocab_size) != int(vocab_size):
                  raise SystemExit(
                      f"Resume checkpoint vocab_size={cfg.vocab_size} does not match tokenizer vocab_size={vocab_size}."
                  )

              checkpoint_special_ids = resume_meta.get("special_ids")
              if checkpoint_special_ids is not None:
                  if not isinstance(checkpoint_special_ids, dict):
                      raise SystemExit("Resume checkpoint meta.special_ids must be an object when present.")
                  normalized = {key: checkpoint_special_ids.get(key) for key in special_ids}
                  if normalized != special_ids:
                      raise SystemExit(
                          "Resume checkpoint special-token ids do not match the selected tokenizer: "
                          + json.dumps({"checkpoint": normalized, "tokenizer": special_ids}, sort_keys=True)
                      )
              return cfg


          '''.replace('          ', '')
          if text.count(main_marker) != 1:
              raise SystemExit(f'Expected one Main marker, found {text.count(main_marker)}')
          if 'def resolve_model_config(' in text:
              raise SystemExit('resolve_model_config already exists; refusing duplicate patch')
          text = text.replace(main_marker, helper + main_marker, 1)

          old_config = '''    sp = tokenizer_special_ids(args.tokenizer)
              vocab_size = tokenizer_vocab_size(args.tokenizer)
              cfg_stage = STAGE_PRESETS[args.stage]

              ArdorConfig = import_project_config()
              model_cfg = ArdorConfig(
                  vocab_size=vocab_size,
                  hidden_size=args.hidden_size,
                  n_layers=args.n_layers,
                  n_heads=args.n_heads,
                  ff_mult=args.ff_mult,
                  max_len=args.ctx,
                  dropout=cfg_stage.dropout,
                  attn_dropout=cfg_stage.dropout,
                  resid_dropout=cfg_stage.dropout,
                  use_rope=True,
                  rope_theta=10000.0,
              )
              model_cfg.validate()
          '''.replace('          ', '')
          new_config = '''    sp = tokenizer_special_ids(args.tokenizer)
              vocab_size = tokenizer_vocab_size(args.tokenizer)
              cfg_stage = STAGE_PRESETS[args.stage]

              resume_ckpt: Optional[Dict[str, Any]] = None
              resume_meta: Dict[str, Any] = {}
              if args.resume is not None:
                  if not args.resume.exists():
                      raise SystemExit(f"Missing resume checkpoint: {args.resume}")
                  loaded = torch.load(args.resume, map_location="cpu")
                  if not isinstance(loaded, dict):
                      raise SystemExit("Resume checkpoint must be a dictionary.")
                  resume_ckpt = loaded
                  raw_meta = loaded.get("meta", {})
                  if raw_meta is None:
                      raw_meta = {}
                  if not isinstance(raw_meta, dict):
                      raise SystemExit("Resume checkpoint meta must be an object.")
                  resume_meta = raw_meta

              ArdorConfig = import_project_config()
              model_cfg = resolve_model_config(
                  ArdorConfig,
                  args=args,
                  cfg_stage=cfg_stage,
                  vocab_size=vocab_size,
                  special_ids=sp,
                  resume_meta=resume_meta,
              )
              if resume_ckpt is not None and "model_config" not in resume_meta:
                  print(f"[{now_str()}] [resume] checkpoint has no meta.model_config; using canonical CLI/stage model config")
          '''.replace('          ', '')
          if text.count(old_config) != 1:
              raise SystemExit(f'Expected one model construction block, found {text.count(old_config)}')
          text = text.replace(old_config, new_config, 1)

          old_resume = '''    if args.resume is not None and args.resume.exists():
              ckpt = torch.load(args.resume, map_location="cpu")
              model.load_state_dict(ckpt["model"], strict=True)
              if "optimizer" in ckpt:
                  optimizer.load_state_dict(ckpt["optimizer"])
              meta = ckpt.get("meta", {})
              global_step = int(meta.get("step", 0))
              tokens_seen = int(meta.get("tokens_seen", 0))
              best_val = float(meta.get("best_val", best_val))
              print(f"[{now_str()}] [resume] ckpt={args.resume} step={global_step} tokens_seen={tokens_seen:,}")
          '''.replace('          ', '')
          new_resume = '''    if resume_ckpt is not None:
              model.load_state_dict(resume_ckpt["model"], strict=True)
              if "optimizer" in resume_ckpt:
                  optimizer.load_state_dict(resume_ckpt["optimizer"])
              global_step = int(resume_meta.get("step", 0))
              tokens_seen = int(resume_meta.get("tokens_seen", 0))
              best_val = float(resume_meta.get("best_val", best_val))
              print(f"[{now_str()}] [resume] ckpt={args.resume} step={global_step} tokens_seen={tokens_seen:,}")
          '''.replace('          ', '')
          if text.count(old_resume) != 1:
              raise SystemExit(f'Expected one resume block, found {text.count(old_resume)}')
          text = text.replace(old_resume, new_resume, 1)

          save_pattern = '                    "best_val": best_val,\n                    "special_ids": sp,\n'
          save_replacement = save_pattern + '                    "model_config": asdict(model_cfg),\n'
          if text.count(save_pattern) != 2:
              raise SystemExit(f'Expected two periodic checkpoint metadata blocks, found {text.count(save_pattern)}')
          text = text.replace(save_pattern, save_replacement)

          final_pattern = '            "best_val": best_val,\n            "special_ids": sp,\n'
          final_replacement = final_pattern + '            "model_config": asdict(model_cfg),\n'
          if text.count(final_pattern) != 1:
              raise SystemExit(f'Expected one final checkpoint metadata block, found {text.count(final_pattern)}')
          text = text.replace(final_pattern, final_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile Cerebrum/Cortex/neural_plasticity_training.py
          git diff --check
      - name: Commit trainer fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cerebrum/Cortex/neural_plasticity_training.py
          git commit -m 'Honor checkpoint model config on canonical resume'
          git push origin HEAD:fix/canonical-checkpoint-migration
