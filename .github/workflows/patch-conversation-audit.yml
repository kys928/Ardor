name: Patch conversation audit

on:
  push:
    branches:
      - ardor-conversation-audit-20260913
    paths:
      - scripts/patch_conversation_audit.py
      - .github/workflows/patch-conversation-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ardor-conversation-audit-20260913
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply scientific patch
        run: python scripts/patch_conversation_audit.py

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify evaluator and serialization audit
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile Erratum/v14a4_diagnostics.py Erratum/ardor_v14a4_conversation_audit.py scripts/runpod_worker.py scripts/runpod_control.py
          pytest -q tests/test_v14a4_family_balanced.py tests/test_v14a4_runpod_runner.py tests/test_conversation_audit.py

      - name: Commit final scientific diff
        run: |
          rm scripts/patch_conversation_audit.py
          rm .github/workflows/patch-conversation-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair v14a4 evaluation and add conversation serialization audit"
          git push origin HEAD:ardor-conversation-audit-20260913
