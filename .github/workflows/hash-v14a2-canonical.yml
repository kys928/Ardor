name: Hash canonical v14a2 checkpoint

on:
  push:
    paths:
      - '.github/workflows/hash-v14a2-canonical.yml'

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-24.04
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ secrets.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ secrets.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ secrets.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install boto3
        run: python -m pip install --disable-pip-version-check boto3
      - name: Stream canonical checkpoint and compute SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import boto3
          from botocore.config import Config

          key = 'Ardor/training/runs/v14_promoted_candidates/v14a2_local_anti_loop_margin_best_u600_CANONICAL_FULLSTATE.pt'
          bucket = os.environ['RUNPOD_NETWORK_VOLUME_ID'].strip()
          datacenter = os.environ['RUNPOD_DATACENTER_ID'].strip()
          endpoint = os.environ.get('RUNPOD_S3_ENDPOINT', '').strip() or f'https://s3api-{datacenter.lower()}.runpod.io/'
          client = boto3.client(
              's3',
              endpoint_url=endpoint,
              region_name=datacenter.lower(),
              aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'].strip(),
              aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'].strip(),
              config=Config(signature_version='s3v4', retries={'max_attempts': 10, 'mode': 'standard'}, connect_timeout=30, read_timeout=300),
          )
          head = client.head_object(Bucket=bucket, Key=key)
          expected_size = int(head['ContentLength'])
          body = client.get_object(Bucket=bucket, Key=key)['Body']
          h = hashlib.sha256()
          seen = 0
          while True:
              chunk = body.read(16 * 1024 * 1024)
              if not chunk:
                  break
              h.update(chunk)
              seen += len(chunk)
          if seen != expected_size:
              raise RuntimeError(f'hashed byte count mismatch: expected={expected_size} actual={seen}')
          print(json.dumps({
              'checkpoint_key': key,
              'size_bytes': seen,
              'sha256': h.hexdigest(),
          }, sort_keys=True))
          PY
