name: Patch v14a4 locked probe runner

on:
  push:
    branches:
      - v14a4-locked-probe-runner
    paths:
      - scripts/patch_v14a4_probe_runner.py
      - .github/workflows/patch-v14a4-probe-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v14a4-locked-probe-runner
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply patch
        run: python scripts/patch_v14a4_probe_runner.py

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify locked runner
        run: |
          python -m py_compile scripts/runpod_control.py scripts/runpod_worker.py
          pytest -q tests/test_v14a3_runpod_runner.py tests/test_v14a4_runpod_runner.py

      - name: Commit final deployment diff
        run: |
          rm scripts/patch_v14a4_probe_runner.py
          rm .github/workflows/patch-v14a4-probe-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Lock v14a4 u100 RunPod probe runner"
          git push origin HEAD:v14a4-locked-probe-runner
