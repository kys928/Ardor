name: v14a2 Canonical Analysis Lightweight Mounted

on:
  push:
    paths:
      - '.github/workflows/run-v14a2-canonical-analysis-lightweight-mounted.yml'
      - 'Erratum/triggers/v14a2-canonical-analysis-lightweight-mounted-20260907.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install control-plane dependency
        run: python -m pip install --disable-pip-version-check boto3
      - name: Launch lightweight mounted canonical analysis
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
          RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
          RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
          RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
          RUNPOD_ALLOWED_GPU_TYPES: ${{ vars.RUNPOD_ALLOWED_GPU_TYPES }}
          RUNPOD_IMAGE_NAME: python:3.11.16-slim-bookworm
          RUNPOD_CONTAINER_REGISTRY_AUTH_ID: ''
        run: python Erratum/launch_v14a2_canonical_analysis_lightweight_mounted.py
      - name: Start continuous RunPod supervisor
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run runpod-supervisor.yml --ref main
