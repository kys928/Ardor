name: Cleanup q010phdqvue9ls 20260907

on:
  push:
    paths:
      - '.github/workflows/cleanup-q010phdqvue9ls-runpodctl-20260907.yml'

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Install and configure RunPod CLI
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          curl -fsSL -o /tmp/runpodctl https://github.com/runpod/runpodctl/releases/latest/download/runpodctl-linux-amd64
          chmod +x /tmp/runpodctl
          mkdir -p ~/.runpod
          printf '{}\n' > ~/.runpod/.runpod.yaml
          /tmp/runpodctl config --apiKey "$RUNPOD_API_KEY" >/dev/null
      - name: Delete superseded unstarted canonical analysis Pod
        run: /tmp/runpodctl pod delete q010phdqvue9ls
