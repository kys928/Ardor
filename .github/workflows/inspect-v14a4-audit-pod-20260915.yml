name: Inspect v14a4 audit Pod 20260915

on:
  push:
    branches:
      - inspect-v14a4-audit-pod-20260915
    paths:
      - '.github/workflows/inspect-v14a4-audit-pod-20260915.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect exact audit Pod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          curl -sS --fail-with-body \
            --request GET \
            --url 'https://rest.runpod.io/v1/pods/h45lxciu9mmm55?includeMachine=true' \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
          | python -c 'import json,sys; p=json.load(sys.stdin); allowed=("id","name","desiredStatus","status","cloudType","gpuCount","gpuTypeIds","costPerHr","imageName","networkVolumeId","lastStatusChange","runtime","machine","interruptible"); print(json.dumps({k:p.get(k) for k in allowed if k in p}, indent=2, default=str))'
