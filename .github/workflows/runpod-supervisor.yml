name: Ardor RunPod Supervisor

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ardor-runpod-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_PROVISIONING_TIMEOUT_MINUTES: ${{ vars.RUNPOD_PROVISIONING_TIMEOUT_MINUTES }}

    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --disable-pip-version-check boto3

      - name: Supervise detached RunPod jobs
        id: supervise
        shell: bash
        run: |
          set +e
          python scripts/runpod_supervisor.py \
            --poll-seconds 30 \
            --lease-minutes 300 \
            --max-consecutive-errors 5
          rc=$?
          set -e

          if [[ "$rc" -eq 75 ]]; then
            echo "handoff=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$rc" -ne 0 ]]; then
            exit "$rc"
          fi
          echo "handoff=false" >> "$GITHUB_OUTPUT"

      - name: Hand supervision to a fresh GitHub runner
        if: steps.supervise.outputs.handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run runpod-supervisor.yml --ref main
          echo "Successor supervisor dispatched. Active RunPod jobs continue uninterrupted."
