name: v14a14 read-only scientific results retrieval

on:
  push:
    branches:
      - research/v14a14-strong-signal-20261023
    paths:
      - 'Erratum/triggers/v14a14-read-results-20261025.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  read-runpod-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Retrieve only the specific frozen v14a14 run from S3 (read-only)
        run: |
          python - <<'PY'
          from pathlib import Path
          import boto3, os, hashlib, json
          from botocore.config import Config
          dc = os.environ['RUNPOD_DATACENTER_ID'].lower()
          endpoint = os.environ.get('RUNPOD_S3_ENDPOINT') or f'https://s3api-{dc}.runpod.io/'
          c = boto3.client('s3', endpoint_url=endpoint, region_name=dc,
                          aws_access_key_id=os.environ['RUNPOD_S3_ACCESS_KEY_ID'],
                          aws_secret_access_key=os.environ['RUNPOD_S3_SECRET_ACCESS_KEY'],
                          config=Config(signature_version='s3v4', retries={'max_attempts':6,'mode':'standard'}))
          bucket=os.environ['RUNPOD_NETWORK_VOLUME_ID']
          prefix='Ardor/training/runs/v14a14_stronger_supervision_run-1792926702-5107b65b/'
          listing=[]
          for page in c.get_paginator('list_objects_v2').paginate(Bucket=bucket, Prefix=prefix):
              listing.extend(page.get('Contents',[]))
          print('RUN_PREFIX',prefix,'OBJECT_COUNT',len(listing))
          for x in listing:
              print('OBJECT',x['Key'][len(prefix):],x['Size'])
          required=[
              'v14a14_posttraining_diagnostic.json',
              'v14a14_frozen_experiment.json',
              'original_80/explicit_eos/arm_result.json',
              'causal_80/explicit_eos/arm_result.json',
              'original_80/explicit_eos/generalization_diagnostic_u0040.json',
              'causal_80/explicit_eos/generalization_diagnostic_u0040.json',
              'original_80/explicit_eos/gradient_clipping_outputs_u0040.json',
              'causal_80/explicit_eos/gradient_clipping_outputs_u0040.json',
              'original_80/explicit_eos/train_steps.jsonl',
              'causal_80/explicit_eos/train_steps.jsonl',
              'blind_human_review/review_packet_blinded.md',
              'blind_human_review/blank_adjudication.json',
              'blind_human_review/review_freeze.json',
              'blind_human_review/sealed_arm_mapping.json',
              'causal_80/candidate/v14a14_causal_u0040_candidate.manifest.json',
          ]
          blind_names={'blind_human_review/review_packet_blinded.md',
                       'blind_human_review/blank_adjudication.json',
                       'blind_human_review/review_freeze.json'}
          idx={x['Key']:x['Size'] for x in listing}
          missing=[p for p in required if prefix+p not in idx]
          if missing:
              raise RuntimeError('Missing required run artifacts: '+repr(missing))
          manifest=[]
          for rel in required:
              dest=Path('retrieved_blind' if rel in blind_names else 'retrieved_sealed')/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              raw=c.get_object(Bucket=bucket,Key=prefix+rel)['Body'].read()
              if len(raw)!=idx[prefix+rel]:
                  raise RuntimeError('Size mismatch '+rel)
              dest.write_bytes(raw)
              manifest.append({'path':rel,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          Path('retrieved_sealed/retrieval_manifest.json').write_text(json.dumps(
              {'S3_prefix':prefix,'objects':manifest},indent=2))
          print('RETRIEVAL_COMPLETE',len(manifest))
          PY
      - name: Publish blinded review packet to job log (no arm assignments)
        run: |
          echo '===BEGIN_V14A14_BLIND_PACKET==='
          cat retrieved_blind/blind_human_review/review_packet_blinded.md
          echo '===END_V14A14_BLIND_PACKET==='
      - uses: actions/upload-artifact@v4
        with:
          name: v14a14-blind-evaluation-packet
          path: retrieved_blind/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: v14a14-sealed-arm-results-and-metrics
          path: retrieved_sealed/
          retention-days: 30
