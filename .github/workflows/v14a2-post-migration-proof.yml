name: v14a2 Post Migration Proof

on:
  push:
    branches: [fix/canonical-checkpoint-migration]
    paths:
      - 'scripts/v14a2_post_migration_probe.py'
      - '.github/workflows/v14a2-post-migration-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install S3 dependency
        run: python -m pip install --disable-pip-version-check boto3
      - name: Verify migrated artifact independently
        run: python scripts/v14a2_post_migration_probe.py
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v14a2-post-migration-proof-${{ github.run_id }}
          path: v14a2_post_migration_proof.json
          if-no-files-found: error
          retention-days: 30
