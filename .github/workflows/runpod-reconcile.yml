name: Ardor RunPod Reconciler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      terminate_control_run_id:
        description: "Optional detached control-run ID to terminate explicitly"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ardor-runpod-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_S3_ACCESS_KEY_ID: ${{ secrets.RUNPOD_S3_ACCESS_KEY_ID }}
      RUNPOD_S3_SECRET_ACCESS_KEY: ${{ secrets.RUNPOD_S3_SECRET_ACCESS_KEY }}
      RUNPOD_NETWORK_VOLUME_ID: ${{ vars.RUNPOD_NETWORK_VOLUME_ID }}
      RUNPOD_DATACENTER_ID: ${{ vars.RUNPOD_DATACENTER_ID }}
      RUNPOD_S3_ENDPOINT: ${{ vars.RUNPOD_S3_ENDPOINT }}
      RUNPOD_PROVISIONING_TIMEOUT_MINUTES: ${{ vars.RUNPOD_PROVISIONING_TIMEOUT_MINUTES }}
      TERMINATE_CONTROL_RUN_ID: ${{ inputs.terminate_control_run_id }}

    steps:
      - name: Check out Ardor
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install boto3
        run: python -m pip install --disable-pip-version-check boto3

      - name: Reconcile or terminate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TERMINATE_CONTROL_RUN_ID:-}" ]]; then
            if [[ ! "$TERMINATE_CONTROL_RUN_ID" =~ ^run-[A-Za-z0-9._-]+$ ]]; then
              echo "Unsafe control-run ID" >&2
              exit 2
            fi
            python scripts/runpod_control.py terminate-run \
              --control-run-id "$TERMINATE_CONTROL_RUN_ID"
          else
            python scripts/runpod_provisioning_watchdog.py
            python scripts/runpod_control.py reconcile-detached
          fi
